<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVU Santhe Mini-CTF</title>
        
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- Matrix Animation Overlay -->
    <div class="matrix-overlay" id="matrixOverlay">
        <div class="matrix-rain" id="matrixRain"></div>
        <div class="matrix-success-message" id="matrixMessage">
            FLAG ACCEPTED<br>
            <span style="font-size: 18px; opacity: 0.8;">ACCESS GRANTED</span>
        </div>
    </div>

    <nav class="main-nav">
        <div class="nav-brand">
            <a href="{% url 'home' %}" class="brand-text">SantheMiniCTF</a>
        </div>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <span class="welcome-text">Welcome, {{ user.username }}!</span>
                <a href="{% url 'leaderboard' %}" class="nav-link">Leaderboard</a>
                <a href="{% url 'logout' %}" class="nav-link logout-btn">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link">Login</a>
                <a href="{% url 'signup' %}" class="nav-link signup-btn">Sign Up</a>
            {% endif %}
        </div>
    </nav>
    
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    {% if messages %}
    <div class="messages-container">
        {% for message in messages %}
            <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <script>
        // Matrix Animation Script
        function createMatrixRain() {
            const matrixRain = document.getElementById('matrixRain');
            const characters = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const columns = Math.floor(window.innerWidth / 15);
            
            matrixRain.innerHTML = '';
            
            for (let i = 0; i < columns; i++) {
                const column = document.createElement('div');
                column.className = 'matrix-column';
                column.style.left = i * 15 + 'px';
                column.style.animationDuration = (Math.random() * 3 + 2) + 's';
                column.style.animationDelay = Math.random() * 2 + 's';
                
                let text = '';
                for (let j = 0; j < Math.random() * 20 + 10; j++) {
                    text += characters[Math.floor(Math.random() * characters.length)];
                }
                column.textContent = text;
                
                matrixRain.appendChild(column);
            }
        }

        function showMatrixAnimation() {
            const overlay = document.getElementById('matrixOverlay');
            createMatrixRain();
            overlay.classList.add('active');
            
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 3000);
        }

        // Check for success messages and trigger matrix animation
        document.addEventListener('DOMContentLoaded', function() {
            const successMessages = document.querySelectorAll('.message.success');
            if (successMessages.length > 0) {
                // Check if the message contains flag-related success
                successMessages.forEach(msg => {
                    if (msg.textContent.toLowerCase().includes('correct') || 
                        msg.textContent.toLowerCase().includes('flag') ||
                        msg.textContent.toLowerCase().includes('success')) {
                        showMatrixAnimation();
                    }
                });
            }
        });

        // Responsive matrix columns on resize
        window.addEventListener('resize', function() {
            if (document.getElementById('matrixOverlay').classList.contains('active')) {
                createMatrixRain();
            }
        });
    </script>
</body>
</html>
